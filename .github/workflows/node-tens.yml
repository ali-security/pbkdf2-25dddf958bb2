name: 'Tests: node.js 10 - 20'

on: [workflow_dispatch]

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://:2025-09-24T06%3A25%3A26.040000Z@time-machines-npm.sealsecurity.io/

jobs:
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [19, 18, 17, 16, 15, 14, 13, 12, 11, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run tests-only

  node:
    name: 'node 10 - 20'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: true
